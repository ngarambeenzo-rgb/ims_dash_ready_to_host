<div id="page-devices" class="page" style="display:none">
  <div class="page-header">
    <div><div class="page-title">Devices</div><div class="page-sub">Each phone or PC must be approved before it can sell. Block one to lock it out.</div></div>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="switchDeviceTab('pending',this)">Waiting <span id="pendingCount" class="nav-badge" style="margin-left:0">0</span></div>
    <div class="tab" onclick="switchDeviceTab('approved',this)">Approved</div>
    <div class="tab" onclick="switchDeviceTab('blocked',this)">Blocked</div>
    <div class="tab" onclick="switchDeviceTab('all',this)">All</div>
  </div>
  <div class="search-bar">
    <input type="text" class="search-input" placeholder="Search by client or device" oninput="filterDevices(this.value)"/>
  </div>
  <div class="card">
    <div class="table-wrap"><table>
      <thead><tr><th>Device ID</th><th>Client</th><th>Device Info</th><th>First Seen</th><th>Last Sync</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="devicesTable"><tr><td colspan="7" style="text-align:center;color:var(--muted);padding:32px">Loading...</td></tr></tbody>
    </table></div>
  </div>
</div>
