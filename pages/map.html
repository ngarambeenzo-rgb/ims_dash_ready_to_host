<div id="page-map" class="page" style="display:none">
  <div class="map-shell" id="mapShell">

    <!-- LEFT: what is on the map -->
    <aside class="map-side">
      <div class="map-stats" id="mapStats">
        <div class="ms"><b id="msClients">0</b><span>clients placed</span></div>
        <div class="ms live"><b id="msLive">0</b><span>devices live</span></div>
        <div class="ms away"><b id="msAway">0</b><span>away from shop</span></div>
        <div class="ms lost"><b id="msLost">0</b><span>marked lost</span></div>
      </div>
      <div class="map-search">
        <svg class="ic ic-sm"><use href="#i-search"/></svg>
        <input id="mapSearch" type="search" placeholder="Find a client, device or any place" autocomplete="off" oninput="mapSearchInput(this.value)" onkeydown="if(event.key==='Enter')mapSearchGo()"/>
      </div>
      <div class="tabs map-tabs">
        <div class="tab active" data-mt="clients" onclick="mapTab('clients',this)">Clients</div>
        <div class="tab" data-mt="devices" onclick="mapTab('devices',this)">Devices</div>
        <div class="tab" data-mt="sites" onclick="mapTab('sites',this)">Sites</div>
        <div class="tab" data-mt="live" onclick="mapTab('live',this)">Live <span class="live-count" id="liveCount" style="display:none">0</span></div>
      </div>
      <div class="map-list" id="mapList"><div class="empty-state">Loading…</div></div>
      <div class="map-foot" id="mapFoot"><span class="live-pulse"></span><span id="mapLiveText">Connecting…</span></div>
    </aside>

    <!-- MAP -->
    <section class="map-stage">
      <div id="mainMap"></div>

      <div class="map-topleft">
        <div class="seg regions" id="regionSeg">
          <button data-r="rwanda" class="on" onclick="mapRegion('rwanda')">Rwanda</button>
          <button data-r="kigali" onclick="mapRegion('kigali')">Kigali</button>
          <button data-r="east" onclick="mapRegion('east')">East Africa</button>
          <button class="more" onclick="mapRegionMenu(event)" title="More countries">More<svg class="ic ic-sm"><use href="#i-chevron"/></svg></button>
        </div>
        <div class="seg" id="styleSeg">
          <button data-s="dark" class="on" onclick="mapStyle('dark')">Night</button>
          <button data-s="satellite" onclick="mapStyle('satellite')">Satellite</button>
        </div>
        <div class="region-menu" id="regionMenu" style="display:none"></div>
      </div>

      <div class="map-right" id="mapRight">
        <div class="map-legend" id="mapLegend">
          <div class="lg-head" onclick="mapLegendToggle()"><b>Map layers</b><svg class="ic ic-sm lg-chev"><use href="#i-chevron"/></svg></div>
          <div class="lg-body">
            <label class="lg-row"><input type="checkbox" checked onchange="mapLayerToggle('clients',this.checked)"/><i class="lg-dot" style="--c:#3b82f6"></i><span>Our clients</span></label>
            <label class="lg-row"><input type="checkbox" checked onchange="mapLayerToggle('devices',this.checked)"/><i class="lg-dot" style="--c:#10b981"></i><span>Our devices</span></label>
            <label class="lg-row"><input type="checkbox" checked onchange="mapLayerToggle('alerts',this.checked)"/><i class="lg-dot" style="--c:#ef4444"></i><span>Alerts (lost or away)</span></label>
            <label class="lg-row"><input type="checkbox" checked onchange="mapLayerToggle('comp',this.checked)"/><i class="lg-dot" style="--c:#22c55e"></i><span>Bars &amp; restaurants</span></label>
            <label class="lg-row"><input type="checkbox" checked onchange="mapLayerToggle('other',this.checked)"/><i class="lg-dot" style="--c:#a855f7"></i><span>Hotels, fuel, health, banks</span></label>
            <label class="lg-row"><input type="checkbox" checked onchange="mapLayerToggle('infra',this.checked)"/><i class="lg-dot" style="--c:#5eead4"></i><span>Landmarks, schools, churches, offices</span></label>
            <label class="lg-row"><input type="checkbox" checked onchange="mapLayerToggle('buildings',this.checked)"/><i class="lg-line" style="--c:#2a4fb0"></i><span>Buildings (3D up close)</span></label>
            <label class="lg-row"><input type="checkbox" checked onchange="mapLayerToggle('bounds',this.checked)"/><i class="lg-line" style="--c:#22d3ee"></i><span>Borders</span></label>
            <div class="lg-sep"></div>
            <div class="lg-key"><i class="lg-line" style="--c:#ff9a2e"></i>Main roads <i class="lg-line" style="--c:#86a6ff;margin-left:10px"></i>Streets <i class="lg-line" style="--c:#3b8cff;margin-left:10px"></i>Rivers</div>
          </div>
        </div>
        <div class="map-detail" id="mapDetail" style="display:none"></div>
      </div>

      <div class="map-insights" id="mapInsights" style="display:none"></div>

      <div class="map-fabs">
        <button onclick="mapZoom(1)" title="Zoom in"><svg class="ic"><use href="#i-plus"/></svg></button>
        <button onclick="mapZoom(-1)" title="Zoom out"><svg class="ic"><use href="#i-minus"/></svg></button>
        <button onclick="mapLocateMe()" title="My location"><svg class="ic"><use href="#i-crosshair"/></svg></button>
        <button onclick="mapTilt()" title="Tilt for 3D"><span class="fab-txt" id="tiltTxt">3D</span></button>
        <button onclick="mapFitAll()" title="Show all our clients and devices"><svg class="ic"><use href="#i-map"/></svg></button>
        <button onclick="mapFullscreen()" title="Fullscreen"><svg class="ic"><use href="#i-expand"/></svg></button>
      </div>

      <div class="map-hint" id="mapHint" style="display:none"></div>
    </section>
  </div>
</div>
