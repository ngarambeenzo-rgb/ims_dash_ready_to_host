<div id="page-clients" class="page" style="display:none">
  <div class="page-header">
    <div><div class="page-title">🏢 Clients</div><div class="page-sub">All businesses using your products</div></div>
    <button class="btn btn-primary" onclick="showAddClient()">+ Add Client</button>
  </div>
  <div class="search-bar">
    <input type="text" class="search-input" placeholder="🔍 Search clients..." oninput="filterClients(this.value)"/>
    <select class="form-input" style="width:160px;min-height:40px" onchange="filterClientsByStatus(this.value)">
      <option value="">All Status</option>
      <option value="active">Active</option>
      <option value="expired">Expired</option>
      <option value="trial">Trial</option>
      <option value="suspended">Suspended</option>
    </select>
  </div>
  <div class="card">
    <div class="table-wrap"><table>
      <thead><tr><th>Business Name</th><th>Activation Key</th><th>Contact</th><th>Product</th><th>Plan</th><th>Devices</th><th>Expiry</th><th>Last Sync</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="clientsTable"><tr><td colspan="9" style="text-align:center;color:var(--muted);padding:32px">Loading...</td></tr></tbody>
    </table></div>
  </div>
</div>
